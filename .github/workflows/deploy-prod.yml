name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

env:
  SITE: https://docs.aidog.xyz
  BASE: /
  CMS_SITE_URL: https://docs.aidog.xyz
  CMS_OAUTH_BASE_URL: https://web-dev.aidog.xyz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.aidog.xyz
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
